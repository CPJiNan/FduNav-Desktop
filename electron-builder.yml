appId: top.cpjinan.fdunav
productName: FduNav
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - resources/icon.png
  - package.json
asar: true
asarUnpack:
  - node_modules/@napi-rs/**/*
npmRebuild: false
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup-${arch}.${ext}
mac:
  icon: resources/icon.icns
  category: public.app-category.productivity
  # 没有 Developer ID 证书时做 ad-hoc 签名，避免 Apple Silicon 将下载的 App 判定为已损坏。
  identity: "-"
  # ad-hoc 签名开启 hardened runtime 会触发库验证并导致启动失败；公证时再开启。
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FduNav
  deleteAppDataOnUninstall: false
